<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Our first 30 days</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/film.js"></script>
    <script src="kit/motion.js"></script>
    <script src="kit/words.js"></script>
    <script src="kit/draw.js"></script>
    <script src="kit/fx.js"></script>
    <script src="kit/gwai.js"></script>
    <script src="kit/debug.js"></script>
    <script src="cues.js"></script>
    <style>
      @font-face { font-family: "GWAI Sans"; src: url("assets/fonts/gwai-sans.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fffde7; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #fffde7; color: #442a1f; font-family: "GWAI Sans", Helvetica, Arial, sans-serif; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      .build { position: absolute; left: 0; top: 0; width: 680px; padding: 14px; background: #ffffff; border: 2px solid #bfd9e3; border-radius: 30px; box-shadow: 0 34px 70px rgba(68,42,31,.16); visibility: hidden; }
      .build img { display: block; width: 652px; height: auto; border-radius: 18px; }
      #badge { position: absolute; left: 90px; width: 900px; padding: 70px 40px; background: #ffffff; border: 2px solid #bfd9e3; border-radius: 36px; box-shadow: 0 34px 70px rgba(68,42,31,.14); display: grid; place-items: center; visibility: hidden; }
      #badge img { display: block; width: 800px; height: auto; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.2258" data-width="1080" data-height="1920">
      <!--
        "100 days of vibe coding": a soft GWAI recap. Layers, bottom to top:
        soft light > hook and builds > brown suspense > cream badge reveal >
        brown ending with the lockup > grain. Every fact on screen comes from
        the challenge page and the day creatives (PROMPT.md).
      -->
      <div id="light" class="full" data-layout-ignore></div>
      <div id="stage" class="full"></div>
      <div id="deck" class="full">
        <div class="build" data-day="1"><img src="assets/images/day1-tripodo.png" alt="Day 1: Tripodo, a travel planner" /></div>
        <div class="build" data-day="2"><img src="assets/images/day2-brb-lockedin.png" alt="Day 2: BRB.LOCKEDIN, a Pomodoro MSN" /></div>
        <div class="build" data-day="3"><img src="assets/images/day3-mathoola.png" alt="Day 3: Mathoola, an app for math learning" /></div>
        <div class="build" data-day="4"><img src="assets/images/day4-sheng-xiao.png" alt="Day 4: a horoscope app" /></div>
        <div class="build" data-day="5"><img src="assets/images/day5-roomlist.png" alt="Day 5: Roomlist, a meeting planner" /></div>
      </div>
      <div id="captions" class="full"></div>
      <div id="suspense" class="full" style="background:#442a1f;visibility:hidden"></div>
      <div id="reveal" class="full" style="background:#fffde7;visibility:hidden">
        <div id="reveal-light" class="full" data-layout-ignore></div>
        <div id="badge"><img src="assets/images/lovable-badge.png" alt="Lovable Certified Expert, Website builder 2026" /></div>
      </div>
      <div id="end" class="full" style="background:#442a1f;visibility:hidden"></div>
      <canvas id="grain" class="full" width="540" height="960" data-layout-ignore style="width:100%;height:100%"></canvas>
      <!-- pf:audio -->
      <audio id="pf-music" data-timeline-role="music" src="assets/audio/bed.wav" data-start="0" data-duration="23.2258" data-track-index="20" data-volume="1"></audio>
      <audio id="pf-sfx-01-tick" src="assets/audio/sfx/tick.wav" data-start="0.1209" data-duration="0.0500" data-track-index="21" data-volume="0.25"></audio>
      <audio id="pf-sfx-02-thud" src="assets/audio/sfx/thud.wav" data-start="0.9654" data-duration="0.4000" data-track-index="21" data-volume="0.35"></audio>
      <audio id="pf-sfx-03-pop" src="assets/audio/sfx/pop.wav" data-start="1.9352" data-duration="0.0900" data-track-index="21" data-volume="0.25"></audio>
      <audio id="pf-sfx-04-whoosh" src="assets/audio/sfx/whoosh.wav" data-start="3.5475" data-duration="0.6000" data-track-index="21" data-volume="0.3"></audio>
      <audio id="pf-sfx-05-whoosh" src="assets/audio/sfx/whoosh.wav" data-start="4.5152" data-duration="0.6000" data-track-index="21" data-volume="0.3"></audio>
      <audio id="pf-sfx-06-whoosh" src="assets/audio/sfx/whoosh.wav" data-start="5.4830" data-duration="0.6000" data-track-index="21" data-volume="0.3"></audio>
      <audio id="pf-sfx-07-whoosh" src="assets/audio/sfx/whoosh.wav" data-start="6.4507" data-duration="0.6000" data-track-index="21" data-volume="0.3"></audio>
      <audio id="pf-sfx-08-whoosh" src="assets/audio/sfx/whoosh.wav" data-start="7.4184" data-duration="0.6000" data-track-index="21" data-volume="0.3"></audio>
      <audio id="pf-sfx-09-whoosh" src="assets/audio/sfx/whoosh.wav" data-start="11.2894" data-duration="0.6000" data-track-index="21" data-volume="0.25"></audio>
      <audio id="pf-sfx-10-chime" src="assets/audio/sfx/chime.wav" data-start="13.5437" data-duration="1.4000" data-track-index="21" data-volume="0.45"></audio>
      <audio id="pf-sfx-11-whoosh" src="assets/audio/sfx/whoosh.wav" data-start="16.1281" data-duration="0.6000" data-track-index="21" data-volume="0.25"></audio>
      <audio id="pf-sfx-12-pop" src="assets/audio/sfx/pop.wav" data-start="19.3545" data-duration="0.0900" data-track-index="21" data-volume="0.25"></audio>
      <!-- /pf:audio -->
    </div>
    <script>
      const b = PF.grid(CUES.grid);
      const $ = PF.$;
      const W = CUES.width, H = CUES.height;
      const G = PF.gwai;
      // Hyped: quicker, bigger rises, a touch more blur. Still the house curve, still no bounce.
      const HYPE = { font: G.FONT, color: G.C.brown, accent: G.C.brown, weight: 800, lineHeight: 1.02, enter: { length: 0.3, rise: 44, blur: 10, ease: G.ease }, exit: { length: 0.2, blur: 8, fall: 14 } };
      const ON_BROWN = Object.assign({}, HYPE, { color: G.C.cream, accent: G.C.blue });

      // Some of the best builds, from the day creatives. Day 4's build time reads "45 HOUR" on the creative, so only the prompts are shown.
      const BUILDS = [
        { name: "TRIPODO", facts: "Day 1. 1 hour. 2 prompts.", rot: -4, dx: -18 },
        { name: "BRB.LOCKEDIN", facts: "Day 2. 35 mins. 4 prompts.", rot: 3, dx: 22 },
        { name: "MATHOOLA", facts: "Day 3. 1 hour. 5 prompts.", rot: -2, dx: -10 },
        { name: "SHENG XIAO ORACLE", facts: "Day 4. 2 prompts.", rot: 4, dx: 16 },
        { name: "ROOMLIST", facts: "Day 5. 1 hour. 2 prompts.", rot: -1, dx: 0 },
      ];
      const cardAt = (i) => b(3, 1 + 2 * i); // one build every 2 beats from bar 3
      const DECK_OUT = b(6, 1);
      const CARD_Y = 870;
      const HITS = BUILDS.map((_, i) => cardAt(i) + 0.3).concat([b(1, 3) + 0.12, b(8, 1) + 0.5]);

      let light, revealLight, pill, hook, rule, pills, facts, withYou, guess, weAre, keep, lockup, cards, badgeRule;

      function setup() {
        light = G.float($("#light"), { n: 7, colors: [G.C.blue, G.C.white, G.C.blue] });
        revealLight = G.float($("#reveal-light"), { n: 6, seed: 29, colors: [G.C.blue, G.C.white] });

        // Bars 1 and 2: the update, then what is coming.
        pill = G.pill($("#stage"), "100 DAY VIBE CODE CHALLENGE", { x: W / 2, y: 520, size: 30, at: b(1, 1, 0.25), out: b(3, 1) });
        hook = PF.punchlines($("#stage"), [
          { lines: [[{ text: "Our", at: b(1, 2) }, { text: "first", at: b(1, 2, 0.5) }], [{ text: "30", at: b(1, 3) }, { text: "days.", at: b(1, 3, 0.5) }]], out: b(2, 1) - 0.22, y: 880, size: 150 },
          { lines: [[{ text: "Here", at: b(2, 1) }, { text: "are", at: b(2, 1, 0.5) }, { text: "some", at: b(2, 2) }, { text: "of", at: b(2, 2, 0.5) }], [{ text: "our", at: b(2, 3) }, { text: "best", at: b(2, 3, 0.5) }, { text: "builds.", at: b(2, 4) }]], out: b(3, 1) - 0.22, y: 880, size: 104 },
        ], HYPE);
        rule = G.rule($("#stage"), { x: W / 2, y: 1080, w: 120, at: b(1, 4), out: b(3, 1) });

        // Bars 3 to 5: the builds slam onto a pile.
        cards = PF.$$("#deck .build").map((el, i) => {
          const im = PF.img["d" + (i + 1)];
          el.querySelector("img").style.height = `${Math.round((652 * im.naturalHeight) / im.naturalWidth)}px`;
          return { el, h: el.offsetHeight, at: cardAt(i), ...BUILDS[i] };
        });
        pills = BUILDS.map((bd, i) => G.pill($("#stage"), bd.name, { x: W / 2, y: 320, size: 32, at: cardAt(i) + 0.08, out: i < 4 ? cardAt(i + 1) : DECK_OUT }));
        facts = PF.captions($("#captions"), BUILDS.map((bd, i) => ({ text: bd.facts, at: cardAt(i) + 0.15, out: i < 4 ? cardAt(i + 1) : DECK_OUT })), { y: 1440, size: 50, weight: 700 }, HYPE);

        // Bar 6: to the women on the hub.
        withYou = PF.punchlines($("#stage"), [
          { lines: [[{ text: "Building", at: b(6, 1) }, { text: "with", at: b(6, 1, 0.5) }, { text: "you", at: b(6, 2) }], [{ text: "on", at: b(6, 3) }, { text: "Lovable.", at: b(6, 3, 0.5) }]], out: b(7, 1), y: 880, size: 108 },
        ], HYPE);

        // Bar 7: suspense on brown, over the riser.
        guess = PF.punchlines($("#suspense"), [
          { lines: [[{ text: "Guess", at: b(7, 2) }, { text: "what...", at: b(7, 3) }]], out: b(8, 1) + 5, y: 900, size: 150 },
        ], ON_BROWN);

        // Bars 8 and 9: the drop and the badge.
        weAre = PF.punchlines($("#reveal"), [
          { lines: [[{ text: "We", at: b(8, 1) + 0.05 }, { text: "are", at: b(8, 1, 0.3) }, { text: "now", at: b(8, 1, 0.6) }]], out: b(9, 3) - 0.2, y: 600, size: 124 },
        ], HYPE);
        const badge = $("#badge");
        badge.querySelector("img").style.height = `${Math.round((800 * PF.img.badge.naturalHeight) / PF.img.badge.naturalWidth)}px`;
        PF.css(badge, { top: `${1000 - badge.offsetHeight / 2}px` });
        badgeRule = G.rule($("#reveal"), { x: W / 2, y: 1000 + badge.offsetHeight / 2 + 90, w: 140, at: b(8, 2, 0.5) });

        // Bar 9.3 to the end: the invitation, then the lockup (held 2 bars and more).
        keep = PF.punchlines($("#end"), [
          { lines: [[{ text: "Keep", at: b(9, 3) + 0.2 }, { text: "building", at: b(9, 3, 0.5) + 0.2 }], [{ text: "with", at: b(9, 4) + 0.1 }, { text: "us.", at: b(9, 4, 0.5) + 0.1 }]], out: b(10, 3) - 0.25, y: 860, size: 132 },
        ], ON_BROWN);
        lockup = G.lockup($("#end"), { y: H * 0.42, color: G.C.cream, at: b(10, 3) + 0.1, cta: "JOIN THE GWAI HUB", handle: "girlswhoai.club" });

        PF.debug({ grid: b, safe: CUES.safe });
      }

      function drawDeck(t) {
        const out = G.easeOut(PF.progress(t, DECK_OUT - 0.25, 0.25));
        PF.show($("#deck"), t >= cards[0].at && t < DECK_OUT);
        PF.css($("#deck"), { opacity: (1 - out).toFixed(3) });
        const n = cards.filter((d) => t >= d.at).length;
        cards.forEach((c, i) => {
          const live = t >= c.at;
          PF.show(c.el, live);
          if (!live) return;
          // a fast drop from above, landing a touch big, then settling to size
          const u = G.ease(PF.progress(t, c.at, 0.38));
          const land = PF.progress(t, c.at + 0.3, 0.25);
          const pop = land > 0 && land < 1 ? 0.05 * Math.sin(Math.PI * land) : 0;
          const settle = Math.min(n - 1 - i, 3) * 0.025;
          const x = W / 2 - 340 + c.dx;
          const y = CARD_Y - c.h / 2 - (1 - u) * 1500;
          const rot = c.rot - (1 - u) * 14;
          PF.css(c.el, { transform: `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${(1 + pop - settle).toFixed(4)})` });
        });
      }

      function draw(t) {
        // a short kick of shake on every landing (the soft light and words move with it)
        const k = PF.shake(t, HITS, { amp: 9, decay: 0.28, rot: 0.3 });
        PF.css($("#stage"), { transform: `translate(${k.x.toFixed(2)}px, ${k.y.toFixed(2)}px)` });
        PF.css($("#deck"), { transform: `translate(${k.x.toFixed(2)}px, ${k.y.toFixed(2)}px) rotate(${k.r.toFixed(3)}deg)` });

        light(t * 1.6);
        pill.draw(t);
        hook(t);
        rule.draw(t);

        drawDeck(t);
        pills.forEach((p) => p.draw(t));
        facts(t);
        withYou(t);

        const s0 = b(7, 1);
        PF.show($("#suspense"), t >= s0 && t < b(8, 1) + 0.5);
        PF.flood($("#suspense"), G.ease(PF.progress(t, s0, 0.4)), "down");
        guess(t);

        const r0 = b(8, 1);
        PF.show($("#reveal"), t >= r0 && t < b(9, 3) + 0.4);
        PF.flood($("#reveal"), G.ease(PF.progress(t, r0, 0.35)), "up");
        revealLight(t * 1.6);
        weAre(t);
        const badge = $("#badge");
        const bu = G.ease(PF.progress(t, r0 + 0.3, 0.45));
        const land = PF.progress(t, r0 + 0.6, 0.3);
        const pop = land > 0 && land < 1 ? 0.06 * Math.sin(Math.PI * land) : 0;
        PF.show(badge, t >= r0 + 0.3);
        PF.css(badge, { opacity: bu.toFixed(3), transform: `translate(${k.x.toFixed(2)}px, ${((1 - bu) * 90 + k.y).toFixed(1)}px) scale(${(0.8 + 0.2 * bu + pop).toFixed(4)})` });
        badgeRule.draw(t);

        const e0 = b(9, 3);
        PF.show($("#end"), t >= e0);
        PF.flood($("#end"), G.ease(PF.progress(t, e0, 0.4)), "down");
        keep(t);
        lockup.draw(t);

        PF.grain($("#grain"), t, { alpha: 0.035 });
      }

      PF.film({
        duration: CUES.duration,
        setup,
        draw,
        waitFor: [PF.loadImages({ d1: "assets/images/day1-tripodo.png", d2: "assets/images/day2-brb-lockedin.png", d3: "assets/images/day3-mathoola.png", d4: "assets/images/day4-sheng-xiao.png", d5: "assets/images/day5-roomlist.png", badge: "assets/images/lovable-badge.png" })],
        register: (tl) => {
          window.__timelines["main"] = tl;
        },
      });
    </script>
  </body>
</html>
